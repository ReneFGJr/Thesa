<div class="container mt-4">
  <form [formGroup]="formAction" (ngSubmit)="onSubmit()">
    <label>{{ language.labels().thesaurusTitle }}</label>
    <div class="mb-3">
      <input
        id="title"
        type="text"
        class="form-control"
        formControlName="title"
      />
    </div>

    <label>{{ language.labels().acronym }}</label>
    <div class="mb-3">
      <input
        id="acronic"
        type="text"
        class="form-control half"
        formControlName="acronic"
      />
    </div>

    <button type="submit" class="btn btn-outline-primary">{{ language.labels().save }}</button>
    <span class="btn btn-outline-warning ms-2" (click)="loadOrigin()"
      >{{ language.labels().cancel }}</span>
  </form>

  <div *ngIf="showSuccess" class="alert alert-success mt-4" role="alert">
    {{ language.labels().savedSuccessfully }}
  </div>

</div>
