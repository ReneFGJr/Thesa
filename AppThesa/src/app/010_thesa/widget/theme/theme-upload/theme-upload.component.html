<form method="post" enctype="multipart/form-data">
  <div class="card-header">
    <h3>{{ language.labels().imageUpload }}</h3>
  </div>
<div class="card p-4">
  <h5>{{ language.labels().imageUpload }}</h5>

  <input #imageFile type="file" (change)="onFileSelected($event)" accept="image/*" hidden>
  <div class="input-group mb-2">
    <button type="button" class="btn btn-outline-secondary" (click)="imageFile.click()">{{ language.labels().chooseFile }}</button>
    <span class="form-control text-break" aria-live="polite">{{ selectedFile?.name || language.labels().noFileChosen }}</span>
  </div>

  <div *ngIf="previewUrl" class="mb-3">
    <img [alt]="language.labels().imagePreview" [src]="previewUrl" class="img-thumbnail" style="max-height: 200px;">
  </div>

  <button type="button" class="btn btn-primary" (click)="uploadImage()" [disabled]="!selectedFile">{{ language.labels().submit }}</button>

  <div *ngIf="uploadProgress > 0" class="mt-3">
    <div class="progress">
      <div class="progress-bar" role="progressbar" [style.width.%]="uploadProgress">
        {{ uploadProgress }}%
      </div>
    </div>
  </div>

  <div *ngIf="uploadSuccess === true" class="alert alert-success mt-3">
    {{ language.labels().uploadCompleted }}
  </div>

  <div *ngIf="uploadSuccess === false" class="alert alert-danger mt-3">
    {{ language.labels().uploadFailed }}
  </div>
</div>
</form>
